<div class="flex flex-col gap-3">
  <div class="swatch h-10 rounded-md border" [style.background]="swatch()" aria-hidden="true"></div>

  <div class="flex flex-col gap-2">
    <label [for]="idPrefix() + '-angle'">Ángulo (grados)</label>
    <input
      pInputText
      [id]="idPrefix() + '-angle'"
      class="w-24"
      type="number"
      min="0"
      max="360"
      [value]="value().angle"
      (input)="setAngle($any($event.target).value)"
    />
  </div>

  <fieldset class="flex flex-col gap-2">
    <legend class="mb-2">Colores</legend>
    @for (stop of value().stops; track $index; let i = $index) {
      <div class="flex items-center gap-2">
        <p-colorpicker
          [ngModel]="stop.color"
          (onChange)="setColor(i, $any($event.value))"
          appendTo="body"
          [inputId]="idPrefix() + '-color-' + i"
          [attr.aria-label]="'Color ' + (i + 1)"
        />
        <input
          pInputText
          type="number"
          class="w-20"
          min="0"
          max="100"
          [value]="stop.position"
          (input)="setPosition(i, $any($event.target).value)"
          [attr.aria-label]="'Posición del color ' + (i + 1) + ' en porcentaje'"
        />
        <span>%</span>
        <button
          pButton
          type="button"
          severity="danger"
          [text]="true"
          [rounded]="true"
          (click)="removeStop(i)"
          [disabled]="!canRemove()"
          [attr.aria-label]="'Quitar color ' + (i + 1)"
        >
          <svg lucideTrash2 class="size-4" aria-hidden="true"></svg>
        </button>
      </div>
    }
  </fieldset>

  <div>
    <p-button label="Agregar color" severity="secondary" [outlined]="true" (onClick)="addStop()" [disabled]="!canAdd()">
      <ng-template #icon>
        <svg lucidePlus class="size-4" aria-hidden="true"></svg>
      </ng-template>
    </p-button>
  </div>
</div>
