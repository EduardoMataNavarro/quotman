<h1 class="page-title">Marca</h1>

@if (loading()) {
  <p-progress-spinner styleClass="size-8!" strokeWidth="4" ariaLabel="Cargando" />
} @else {
  <div class="grid gap-6 xl:grid-cols-[minmax(0,26rem)_minmax(0,1fr)]">
    <div class="flex flex-col gap-6">
      @for (surface of surfaces; track surface.key) {
        <p-card [header]="surface.title">
          <div class="flex flex-col gap-4">
            <div class="flex items-center gap-2">
              <p-checkbox
                [inputId]="surface.key + '-use-gradient'"
                [binary]="true"
                [ngModel]="!!state(surface.key).gradient"
                (ngModelChange)="toggleGradient(surface.key, $event)"
              />
              <label [for]="surface.key + '-use-gradient'">Usar degradado</label>
            </div>
            @if (state(surface.key).gradient; as gradient) {
              <qm-gradient-picker [idPrefix]="surface.key" [value]="gradient" (changed)="setGradient(surface.key, $event)" />
            }

            <div class="flex flex-col gap-2">
              <label [for]="surface.key + '-css'">CSS adicional</label>
              <textarea
                pTextarea
                [id]="surface.key + '-css'"
                class="w-full font-mono text-xs leading-relaxed"
                rows="4"
                spellcheck="false"
                [value]="state(surface.key).css"
                (input)="setCss(surface.key, $any($event.target).value)"
              ></textarea>
              <p-message size="small" severity="secondary" variant="simple">{{ surface.hint }}</p-message>
            </div>
          </div>
        </p-card>
      }

      @if (error(); as msg) {
        <p-message severity="error" role="alert">{{ msg }}</p-message>
      }

      <div class="flex flex-wrap justify-end gap-2">
        <p-button label="Usar la plantilla" severity="secondary" [outlined]="true" (onClick)="reset()" />
        <p-button label="Guardar" [loading]="saving()" (onClick)="save()" />
      </div>
    </div>

    <section aria-label="Vista previa" class="min-w-0">
      <div class="preview-page" [class.preview-page-default]="!pageCss()" [attr.style]="pageCss() || null">
        <div class="preview-scale">
          <qm-quotation-document [document]="preview()" />
        </div>
      </div>
    </section>
  </div>
}
