<div class="flex h-dvh">
  <!-- Desktop sidebar: collapsible into an icon rail (w-64 ⇄ w-20). -->
  <aside
    class="shell-panel relative z-20 hidden shrink-0 flex-col border-r transition-[width] duration-200 ease-(--ease-standard) motion-reduce:transition-none lg:flex"
    [class.w-64]="!sidebarCollapsed()"
    [class.w-20]="sidebarCollapsed()"
    aria-label="Navegación principal"
  >
    <qm-sidebar [collapsed]="sidebarCollapsed()" />
  </aside>

  <!-- Mobile drawer -->
  <p-drawer [(visible)]="drawerOpen" styleClass="w-72! max-w-11/12 lg:hidden" ariaLabel="Navegación principal">
    <ng-template #headless>
      <qm-sidebar (closed)="drawerOpen.set(false)" />
    </ng-template>
  </p-drawer>

  <div class="flex min-w-0 flex-1 flex-col">
    <p-toolbar styleClass="h-14 shrink-0 rounded-none! border-x-0! border-t-0! px-4! py-0! sm:px-6!">
      <ng-template #start>
        <p-button
          styleClass="lg:hidden"
          [text]="true"
          [rounded]="true"
          severity="secondary"
          (onClick)="drawerOpen.set(true)"
          ariaLabel="Abrir menú"
        >
          <svg lucideMenu class="size-4" aria-hidden="true"></svg>
        </p-button>
      </ng-template>

      <ng-template #end>
        <div class="flex items-center gap-1">
          <p-button
            [text]="true"
            [rounded]="true"
            severity="secondary"
            (onClick)="toggleDark()"
            [ariaLabel]="themeLabel()"
            [pTooltip]="themeLabel()"
            tooltipPosition="bottom"
          >
            @if (darkMode()) {
              <svg lucideSun class="size-4" aria-hidden="true"></svg>
            } @else {
              <svg lucideMoon class="size-4" aria-hidden="true"></svg>
            }
          </p-button>

          <p-button
            [text]="true"
            [rounded]="true"
            severity="secondary"
            (onClick)="userMenu.toggle($event)"
            [ariaLabel]="accountLabel()"
            [pTooltip]="accountLabel()"
            tooltipPosition="bottom"
          >
            <svg lucideUserRound class="size-4" aria-hidden="true"></svg>
          </p-button>
        </div>
      </ng-template>
    </p-toolbar>

    <p-menu #userMenu [model]="accountItems()" [popup]="true" appendTo="body" />

    <!-- Single scroll region -->
    <main #scrollContainer id="main-content" class="flex-1 overflow-y-auto" tabindex="-1">
      <div class="anim-page-enter w-full px-4 py-6 sm:px-6 md:px-8">
        <router-outlet />
      </div>
    </main>
  </div>
</div>

<qm-change-password-dialog [(visible)]="changingPassword" />
