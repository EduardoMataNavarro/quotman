<!-- Wordmark row, level with the toolbar. -->
<div
  class="shell-panel flex h-14 shrink-0 items-center border-b"
  [class.gap-2]="!collapsed()"
  [class.px-4]="!collapsed()"
  [class.justify-center]="collapsed()"
>
  @if (!collapsed()) {
    <p class="font-heading text-lg font-semibold">Quotman</p>
    <p-tag value="Admin" severity="secondary" />
    <div class="flex-1"></div>
  } @else {
    <p class="font-heading text-lg font-semibold" aria-hidden="true">Q</p>
  }
  <p-button
    styleClass="lg:hidden"
    [text]="true"
    [rounded]="true"
    severity="secondary"
    (onClick)="closed.emit()"
    ariaLabel="Cerrar menú"
  >
    <svg lucideX class="size-4" aria-hidden="true"></svg>
  </p-button>
</div>

<!-- Collapse handle straddling the panel's right edge; desktop only. -->
<p-button
  styleClass="absolute! top-4 right-0 z-10 hidden! size-6! translate-x-1/2 p-0! lg:inline-flex!"
  [rounded]="true"
  [outlined]="true"
  severity="secondary"
  size="small"
  (onClick)="toggleCollapse()"
  [ariaLabel]="collapsed() ? 'Expandir menú' : 'Contraer menú'"
>
  @if (collapsed()) {
    <svg lucideChevronRight class="size-3" aria-hidden="true"></svg>
  } @else {
    <svg lucideChevronLeft class="size-3" aria-hidden="true"></svg>
  }
</p-button>

<nav class="flex-1 overflow-y-auto px-3 py-3" aria-label="Secciones">
  <ul class="flex flex-col gap-1">
    @for (item of items; track item.route) {
      <li>
        <a
          pButton
          severity="secondary"
          class="w-full"
          [class.justify-start!]="!collapsed()"
          [text]="!isActive(item.route)"
          [routerLink]="item.route"
          [attr.aria-current]="isActive(item.route) ? 'page' : null"
          [attr.aria-label]="collapsed() ? item.label : null"
          [pTooltip]="collapsed() ? item.label : ''"
          tooltipPosition="right"
          (click)="closed.emit()"
        >
          <svg [lucideIcon]="item.icon" class="size-5 shrink-0" aria-hidden="true"></svg>
          @if (!collapsed()) {
            <span>{{ item.label }}</span>
          }
        </a>
      </li>
    }
  </ul>
</nav>
