<p-dialog
  header="Cambiar contraseña"
  [modal]="true"
  [visible]="visible()"
  (visibleChange)="$event ? visible.set(true) : close()"
  [draggable]="false"
  [style]="{ width: '28rem' }"
  [breakpoints]="{ '640px': '92vw' }"
>
  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
    <div class="flex flex-col gap-2">
      <label for="current-password">Contraseña actual</label>
      <p-password
        inputId="current-password"
        formControlName="currentPassword"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="current-password"
        [fluid]="true"
      />
    </div>
    <div class="flex flex-col gap-2">
      <label for="new-password">Nueva contraseña</label>
      <p-password
        inputId="new-password"
        formControlName="newPassword"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="new-password"
        [fluid]="true"
      />
      <p-message size="small" severity="secondary" variant="simple">Al menos 12 caracteres.</p-message>
    </div>

    @if (error(); as msg) {
      <p-message severity="error" role="alert">{{ msg }}</p-message>
    }

    <div class="flex justify-end gap-2">
      <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="close()" />
      <p-button type="submit" label="Guardar" [loading]="busy()" [disabled]="form.invalid || busy()" />
    </div>
  </form>
</p-dialog>
