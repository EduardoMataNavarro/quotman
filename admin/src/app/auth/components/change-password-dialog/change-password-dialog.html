<p-dialog
  header="Cambiar contraseña"
  [modal]="true"
  [visible]="visible()"
  (visibleChange)="$event ? visible.set(true) : close()"
  [draggable]="false"
  [style]="{ width: '28rem' }"
  [breakpoints]="{ '640px': '92vw' }"
>
  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
    <div class="field-group">
      <label class="field-label" for="current-password">Contraseña actual</label>
      <p-password
        inputId="current-password"
        formControlName="currentPassword"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="current-password"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
    </div>
    <div class="field-group">
      <label class="field-label" for="new-password">Nueva contraseña</label>
      <p-password
        inputId="new-password"
        formControlName="newPassword"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="new-password"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
      <p class="field-hint">Al menos 12 caracteres.</p>
    </div>

    @if (error(); as msg) {
      <p class="field-error" role="alert">{{ msg }}</p>
    }

    <div class="flex justify-end gap-2">
      <button type="button" class="btn-neutral" (click)="close()">Cancelar</button>
      <button type="submit" class="btn-primary" [disabled]="form.invalid || busy()">Guardar</button>
    </div>
  </form>
</p-dialog>
