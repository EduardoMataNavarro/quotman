<main class="flex min-h-dvh items-center justify-center px-6 py-10">
  <p-card styleClass="w-full max-w-md">
    <ng-template #title>Iniciar sesión</ng-template>

    <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
      <div class="flex flex-col gap-2">
        <label for="email">Correo electrónico</label>
        <input id="email" pInputText type="email" formControlName="email" autocomplete="email" inputmode="email" fluid />
      </div>

      <div class="flex flex-col gap-2">
        <label for="password">Contraseña</label>
        <p-password
          inputId="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
          [fluid]="true"
        />
      </div>

      @if (error(); as msg) {
        <p-message severity="error" role="alert">{{ msg }}</p-message>
      }

      <p-button
        type="submit"
        label="Ingresar"
        [loading]="busy()"
        [disabled]="form.invalid || busy()"
        [fluid]="true"
      />
    </form>
  </p-card>
</main>
