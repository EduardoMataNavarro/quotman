<main class="flex min-h-dvh flex-col lg:flex-row">
  <section class="flex items-center justify-center bg-void px-6 py-8 lg:order-2 lg:w-2/5 lg:py-0" aria-label="Marca">
    <div class="flex flex-col items-center gap-2 text-center">
      <p class="font-heading text-3xl font-semibold text-mist lg:text-4xl">Quotman</p>
      <p class="text-sm text-ice">Administración</p>
    </div>
  </section>

  <section class="flex flex-1 items-center justify-center px-6 py-10 lg:order-1 lg:w-3/5">
    <form class="silver-pane w-full max-w-md rounded-card p-8" [formGroup]="form" (ngSubmit)="submit()">
      <h1 class="text-2xl text-void dark:text-mist">Iniciar sesión</h1>

      <div class="mt-6 flex flex-col gap-4">
        <div class="field-group">
          <label class="field-label" for="email">Correo electrónico<span aria-hidden="true"> *</span></label>
          <input id="email" pInputText type="email" formControlName="email" autocomplete="email" inputmode="email" />
        </div>

        <div class="field-group">
          <label class="field-label" for="password">Contraseña<span aria-hidden="true"> *</span></label>
          <p-password
            inputId="password"
            formControlName="password"
            [feedback]="false"
            [toggleMask]="true"
            autocomplete="current-password"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
        </div>

        @if (error(); as msg) {
          <p class="field-error" role="alert">{{ msg }}</p>
        }

        <button type="submit" class="btn-primary w-full" [disabled]="form.invalid || busy()">
          @if (busy()) {
            <span class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white" aria-hidden="true"></span>
            Ingresando…
          } @else {
            Ingresar
          }
        </button>
      </div>
    </form>
  </section>
</main>
